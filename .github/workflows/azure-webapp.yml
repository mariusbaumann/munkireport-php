name: Deploy to Azure Web App

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, ldap, pdo_mysql, curl, soap, zip
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Create ZIP
        run: zip -qr app.zip . -x '.git/*' 'swift-agent/*' 'tests/*' 'node_modules/*'

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: umbmukireport
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
          # keep .env and app/db (sqlite) that only exist on the server
          clean: false
